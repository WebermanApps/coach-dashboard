<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>Coach Suggestions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Khand:wght@700&family=Hind:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FDFBF6;--card:#fff;--fg:#0a0a0a;--pri:#171717;--mut:#737373;--bd:#e5e5e5;--blue:#155dfc;--green:#16a34a;--amber:#d97706;--r:.75rem;--ease:cubic-bezier(.2,.8,.2,1);--dur:180ms}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font:16px/1.5 "Hind",system-ui,sans-serif}
h1,h2,h3{font-family:"Khand",sans-serif;font-weight:700;line-height:1.1;margin:0}
h1{font-size:2.2rem}h2{font-size:1.6rem}h3{font-size:1.2rem}
.wrap{max-width:900px;margin:0 auto;padding:1.25rem}
.label{text-transform:uppercase;letter-spacing:.1em;font-size:.75rem;color:var(--mut);font-weight:600}
.mw-hover{transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.mw-hover:hover,.mw-hover:focus-visible{transform:translateY(-1px) scale(1.03);box-shadow:0 6px 18px rgba(10,10,10,.12)}
.mw-hover:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){.mw-hover,.mw-hover:hover{transition:none;transform:none}}
.btn{display:inline-flex;align-items:center;gap:.5rem;min-height:48px;padding:0 2rem;border:2px solid var(--pri);background:transparent;color:var(--pri);font:600 .85rem "Hind",sans-serif;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;border-radius:0;text-decoration:none}
.btn:hover{background:var(--pri);color:#fafafa}
footer{text-align:center;padding:2rem 1rem 3rem;color:var(--mut)}footer a{color:var(--fg);display:inline-block;padding:.75rem 0;min-height:44px}
.tbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.75rem;margin:0 -1.25rem .75rem;padding:0 1.25rem;min-height:48px;background:rgba(253,251,246,.96);border-bottom:1px solid var(--bd);backdrop-filter:blur(6px)}
.tbar .home{color:var(--fg);text-decoration:none;font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:.8rem;display:inline-flex;align-items:center;min-height:44px;min-width:44px}
.tbar .nm{font:700 1.15rem "Khand",sans-serif;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar .upd{color:var(--mut);font-size:.8rem;white-space:nowrap}
.tbar .shic{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;width:44px;height:44px;padding:0;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--pri);cursor:pointer}
.tbar .shic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);background:#fff;border:1px solid var(--bd);padding:.5rem .85rem;border-radius:var(--r);box-shadow:0 4px 14px rgba(10,10,10,.08);z-index:40;color:var(--green);font-size:.9rem;display:none}
#toast.on{display:block}
.sub{color:var(--mut);margin:.35rem 0 1rem}
.deckhead{margin:0 0 1rem}
.deckhead a.dblink{display:inline-flex;align-items:center;min-height:44px;font:600 .8rem "Hind",sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);text-decoration:none}
/* Equal numbered cards (Pick 15 A) */
.scards{display:grid;gap:.85rem;grid-template-columns:1fr}
.scard{display:flex;flex-direction:column;gap:.55rem;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:1rem;min-height:180px;height:100%}
.scard .toprow{display:flex;align-items:flex-start;gap:.75rem}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--pri);color:#fafafa;display:grid;place-items:center;font:700 1rem "Khand",sans-serif}
.scard h3{font-size:1.25rem;flex:1;min-width:0}
.scard .fx{margin:0;font-size:1rem}.scard .fx b{font-weight:600}
.scard .own{margin:0;color:var(--mut);font-size:.85rem}
.scard figure{margin:.25rem 0 0;max-width:100%}.scard figure img{display:block;width:100%;height:auto;border:1px solid var(--bd);border-radius:var(--r);background:#fff}
.qv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;max-width:30rem;margin-top:.25rem}
.qb{min-height:48px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;border:2px solid var(--bd);background:#fff;color:var(--fg);font:600 .9rem "Hind",sans-serif;cursor:pointer;border-radius:0;padding:0 .4rem;touch-action:manipulation}
.qb svg{width:16px;height:16px;flex:none}
.qb[data-v=no].on{background:#e5e5e5;border-color:#737373}.qb[data-v=maybe].on{background:#fef3c7;border-color:var(--amber)}
.qb[data-v=yes].on{background:#dcfce7;border-color:var(--green)}
.qn{margin-top:.15rem;align-self:flex-start;min-height:44px;min-width:44px;background:none;border:0;color:var(--mut);font:600 .85rem "Hind",sans-serif;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;padding:0 .25rem}
.scard textarea{display:none;width:100%;min-height:4.5rem;margin-top:.15rem;font:inherit;padding:.5rem;border:1px solid var(--bd);border-radius:0}.scard textarea.show{display:block}
.mws-wrap{max-width:none!important}.mws-btn{width:100%!important;min-height:64px!important;font-size:1.4rem!important}
#qBackRow{display:flex;justify-content:center;margin:1rem 0 .75rem}
#qCopyRow{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:center}#qCopyMsg{color:var(--green);font-size:.9rem}
#qCopyBox{width:100%;min-height:6rem;margin-top:.5rem}
.std{background:#fff;border:1px solid var(--bd);border-radius:var(--r);margin:1rem 0}.std summary{min-height:44px;padding:.75rem 1rem;cursor:pointer;font:700 1.15rem "Khand",sans-serif}.std ol{margin:0;padding:0 1rem 1rem 2.25rem}.std li{margin:.25rem 0}
.qdone{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:1.25rem}
@media (min-width:700px){.scards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1600px){
html{font-size:20px}.wrap{max-width:70vw;padding:1.75rem}.tbar{margin:0 -1.75rem .85rem;padding:0 1.75rem;min-height:56px}
.num{width:36px;height:36px}.qb{min-height:56px}.scards{gap:1.1rem}
}
@media (min-width:2400px){
html{font-size:24px}.wrap{padding:2.25rem}.tbar{margin:0 -2.25rem 1rem;padding:0 2.25rem;min-height:64px}
.num{width:40px;height:40px}.scards{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style><script src="ptr.js" defer></script></head><body><main class="wrap">
<header class="tbar" aria-label="Top Bar">
<a class="home mw-hover" href="./">← Coach</a>
<span class="nm">Coach Suggestions</span>
<span class="upd">Updated Oct 14, 3:22 PM ICT</span>
<button id="share" class="shic mw-hover" type="button" aria-label="Share" title="Share"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
</header>
<div class="deckhead">
<a class="dblink mw-hover" href="https://webermanapps.github.io/branding-djqmb410/decks/">Deck Building</a>
<div class="label" id="qRound">Coach · Questionnaire</div>
<h1 id="qTitle">Coach Suggestions</h1>
<p class="sub" id="qSub"></p>
</div>
<div id="qList" class="scards" aria-label="Suggestions"></div>
<details class="std" id="qSettled" hidden><summary id="qSetSum">Settled Today</summary><ol id="qSetList"></ol></details>
<div id="mwSubmit"></div>
<div id="qBackRow"><a class="btn mw-hover" id="qBack" href="https://webermanapps.github.io/branding-djqmb410/decks/">Back To Deck Building</a></div>
<div id="qCopyRow"><button type="button" class="btn mw-hover" id="qCopy">Copy My Answers</button><span id="qCopyMsg" role="status" aria-live="polite"></span></div>
<textarea id="qCopyBox" readonly hidden aria-label="Your answers, select and copy"></textarea>
<div id="toast" aria-live="polite"></div>
</main>
<footer><a class="mw-hover" href="https://maxweberman.com">Built by Max Weberman</a></footer>
<script src="submit.js?v=gr2"></script>
<script>
document.getElementById('share').onclick=async()=>{const u=location.href.split('#')[0],sm=(window.mwShareSummary&&window.mwShareSummary())||'',t=(sm?sm+'\n':'')+'Coach Suggestions';
if(navigator.share){try{await navigator.share({title:t,url:u});return}catch(e){if(e.name==='AbortError')return}}
if(/iPhone|iPad|Android/i.test(navigator.userAgent)){location.href='sms:?&body='+encodeURIComponent(t+' '+u);return}
try{await navigator.clipboard.writeText(t+' '+u);const toast=document.getElementById('toast');toast.textContent='Link copied';toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),2000)}catch(e){prompt('Copy link',u)}};
</script>
<script>
/* Equal numbered cards (Pick 15 A). Answers + notes autosave; Submit via MWSubmit; submitted cards stay hidden (coach-q-submitted). */
(function(){
const $=id=>document.getElementById(id),e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={no:'<svg viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
maybe:'<svg viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round"><path d="M9.5 9a2.6 2.6 0 1 1 3.6 2.4c-.8.4-1.1 1-1.1 1.8v.6"/><circle cx="12" cy="17.6" r=".6" fill="#d97706"/></svg>',
yes:'<svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>'};
const ORDER=['yes','maybe','no'],L={no:'No',maybe:'Maybe',yes:'Yes'};
let D,KEY,st={},ALLI=[];const SK='coach-q-submitted';let SENT={};try{SENT=JSON.parse(localStorage.getItem(SK))||{}}catch(_){SENT={}}
function markSent(){ALLI.forEach(i=>{const v=st[i.id];if(!SENT[i.id]&&v&&(v.answer||(v.note&&v.note.trim()))){SENT[i.id]=new Date().toISOString()}});try{localStorage.setItem(SK,JSON.stringify(SENT))}catch(_){}D.items=ALLI.filter(i=>!SENT[i.id]);render()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(_){}};
function summary(){if(!D)return'';const c={yes:0,maybe:0,no:0};D.items.forEach(i=>{const v=st[i.id];if(v&&v.answer)c[v.answer]++});
 const out=['Coach suggestions '+D.round+': '+c.yes+' Yes, '+c.maybe+' Maybe, '+c.no+' No'];
 D.items.forEach(i=>{const v=st[i.id];if(v&&(v.answer||v.note))out.push('- '+i.title+': '+(v.answer?L[v.answer]:'No vote')+(v.note?' | Note: '+v.note.trim():''))});return out.join('\n')}
window.mwShareSummary=summary;
function render(){if(!D.items.length){$('qList').innerHTML='<div class="qdone"><h3>All Caught Up</h3><p class="sub">Every suggestion here has been sent to Coach. New ones appear when Coach publishes the next round.</p></div>';return}
 $('qList').innerHTML=D.items.map((i,n)=>{const v=st[i.id]||{};return '<article class="scard" data-id="'+e(i.id)+'"><div class="toprow"><span class="num" aria-hidden="true">'+(n+1)+'</span><h3>'+e(i.title)+'</h3></div>'+
 (i.problem?'<p class="fx"><b>The Problem:</b> '+e(i.problem)+'</p><p class="fx"><b>The Fix:</b> '+e(i.fix)+'</p>':'<p class="fx">'+e(i.why||'')+'</p>')+
 (i.owner?'<p class="own">Who does it: '+e(i.owner)+'</p>':'')+
 (i.img?'<figure><img src="'+e(i.img)+'" alt="'+e(i.alt||'')+'" width="720" height="400" loading="lazy"></figure>':'')+
 '<div class="qv" role="group" aria-label="Answer for '+e(i.title)+'">'+
 ORDER.map(k=>'<button type="button" class="qb mw-hover'+(v.answer===k?' on':'')+'" data-v="'+k+'" aria-pressed="'+(v.answer===k)+'">'+IC[k]+L[k]+'</button>').join('')+'</div>'+
 '<button type="button" class="qn mw-hover" aria-expanded="'+(!!v.note)+'">Add Note</button><textarea class="'+(v.note?'show':'')+'" aria-label="Note for '+e(i.title)+'">'+e(v.note||'')+'</textarea></article>'}).join('')}
fetch('suggestions.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;ALLI=d.items.slice();d.items=ALLI.filter(i=>!SENT[i.id]);KEY='coach-q-'+d.round;try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){st={}}
 $('qTitle').textContent=d.title||'Coach Suggestions';if(d.settled&&d.settled.length){$('qSetSum').textContent='Settled Today ('+d.settled.length+')';$('qSetList').innerHTML=d.settled.map(x=>'<li><strong>'+e(x.title)+'</strong>: '+e(x.note)+'</li>').join('');$('qSettled').hidden=false}$('qSub').textContent=d.subtitle||'';render();
 $('qList').addEventListener('click',ev=>{const q=ev.target.closest('.scard');if(!q)return;const id=q.dataset.id,b=ev.target.closest('.qb');
  if(b){const k=b.dataset.v;st[id]=Object.assign(st[id]||{},{answer:(st[id]&&st[id].answer===k)?null:k,time:new Date().toISOString()});save();
   q.querySelectorAll('.qb').forEach(x=>{const on=x.dataset.v===st[id].answer;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});return}
  if(ev.target.closest('.qn')){const t=q.querySelector('textarea');t.classList.toggle('show');ev.target.closest('.qn').setAttribute('aria-expanded',t.classList.contains('show'));if(t.classList.contains('show'))t.focus()}});
 $('qList').addEventListener('input',ev=>{const q=ev.target.closest('.scard');if(!q||ev.target.tagName!=='TEXTAREA')return;const id=q.dataset.id;st[id]=Object.assign(st[id]||{},{note:ev.target.value,time:new Date().toISOString()});save()});
 MWSubmit.button($('mwSubmit'),{agent:'coach',app:'coach-dashboard',deck:d.round,
  getResults:()=>{save();const r={round:d.round,answers:st,questions:d.items.map(i=>({id:i.id,title:i.title}))};setTimeout(markSent,0);return r},getNotes:summary});
 $('qCopy').onclick=async()=>{const t=summary()+'\n'+location.href.split('#')[0];try{await navigator.clipboard.writeText(t);$('qCopyMsg').textContent='Copied'}catch(_){const b=$('qCopyBox');b.value=t;b.hidden=false;b.select()}};
}).catch(()=>{});
})();
</script></body></html>
